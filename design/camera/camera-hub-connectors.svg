  <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#313A46"/>
    <stop offset="0.55" stop-color="#11161E"/>
    <stop offset="1" stop-color="#05070B"/>
  </linearGradient>
  <linearGradient id="whiteShell" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.55" stop-color="#E9EEF4"/>
    <stop offset="1" stop-color="#A9B4C0"/>
  </linearGradient>
  <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0D1824"/>
    <stop offset="0.55" stop-color="#02060A"/>
    <stop offset="1" stop-color="#10283B"/>
  </linearGradient>
  <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#0A78FF" stop-opacity="0.9"/>
    <stop offset="0.4" stop-color="#0A78FF" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#0A78FF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
